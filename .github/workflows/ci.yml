name: CI

on:
  push:
    branches: [main, master, html]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static site files
        run: |
          test -f index.html
          test -f logo.png
          test -f data/extras.json
          test -f assets/index.js
          test -f assets/index.css
          test -f assets/examples.json
          test ! -d vendor
